<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
  /* ================= PAGE ================= */
  body {
    background: #1a1a1a;
    color: #e8e0cc;
    font-family: Georgia, serif;
    margin: 0;
    padding: 16px;
  }
  h2 { color: #c9a227; font-weight: normal; letter-spacing: 1px; margin-top: 0; }

  .panel {
    background: #262626;
    border: 1px solid #c9a22755;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 12px;
  }

  /* ================= DÉS ================= */
  #game { display: flex; flex-direction: column; gap: 12px; }

  #diceArea {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .die {
    width: 52px;
    height: 52px;
    border-radius: 10px;
    background: #333;
    border: 2px solid #555;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    user-select: none;
    font-size: 22px;
  }
  .die.selected { border-color: #c9a227; background: #3a331a; }
  .die.success { background: #1e3a1e; border-color: #4caf50; color: #a5d6a7; }
  .die.fail { background: #3a1e1e; border-color: #c0392b; color: #e57373; }
  .die.violet { background: #3a1e3a; border-color: #9b59b6; color: #d7bde2; }

  .remove {
    position: absolute;
    top: -6px;
    right: -6px;
    background: #c0392b;
    color: white;
    border-radius: 50%;
    width: 18px;
    height: 18px;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  /* ================= CONTRÔLES ================= */
  .row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  input, button, select {
    background: #333;
    color: #e8e0cc;
    border: 1px solid #666;
    border-radius: 6px;
    padding: 8px;
    font-family: Georgia, serif;
  }
  button { cursor: pointer; border-color: #c9a227; }
  button:hover { background: #3a331a; }
  label { font-size: 14px; }

  /* ================= TOTAL ================= */
  #total {
    font-size: 22px;
    color: #c9a227;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .skull { font-size: 30px; display: none; }
  .skull.show { display: inline; }

  /* ================= ÉCHELLE (LANCÉS / ÉCHECS) ================= */
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 15px;
  }
  th, td {
    border: 1px solid #555;
    padding: 6px 10px;
    text-align: center;
  }
  th { color: #c9a227; font-weight: normal; }
  tr.active {
    background: #3a331a;
    color: #c9a227;
    font-weight: bold;
  }
</style>
</head>
<body>

<h2>🎲 Dés de difficulté</h2>

<div id="game" class="panel">

  <!-- Contrôles -->
  <div class="row">
    <label>Difficulté :
      <input type="number" id="threshold" value="6" min="1" max="10" style="width:60px">
    </label>
    <button id="rollBtn">🎲 Lancer</button>
    <button id="rerollBtn">↻ Relancer sélection</button>
    <button id="addBtn">➕ Ajouter un dé</button>
    <button id="resetBtn">♻️ Nouvelle partie</button>
  </div>

  <!-- Zone des dés -->
  <div id="diceArea"></div>

  <!-- Total -->
  <div id="total">
    Total : <span id="totalVal">0</span>
    <span class="skull" id="skull">💀</span>
  </div>

  <!-- Échelle -->
  <div class="panel">
    <table>
      <tr><th>Lancés</th><th>Échecs</th></tr>
      <tbody id="scaleBody"></tbody>
    </table>
  </div>

</div>

<script>
/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyCfDD1S1Wt5fgGFdRP19FEPtLvEsjNCb1k",
  authDomain: "des10-c059f.firebaseapp.com",
  databaseURL: "https://des10-c059f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "des10-c059f",
  storageBucket: "des10-c059f.firebasestorage.app",
  messagingSenderId: "448343575723",
  appId: "1:448343575723:web:a19146cff43f2674103bee"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const gameRef = db.ref("game");

/* ================= VÉRIFICATION CONNEXION ================= */
const connectedRef = firebase.database().ref(".info/connected");
connectedRef.on("value", snap => {
  if (snap.val() === true) {
    console.log("✅ Connecté à Firebase");
  } else {
    console.log("❌ Déconnecté de Firebase");
  }
});

const myId = Math.random().toString(36).slice(2);  // identifiant de CE joueur

/* ================= ÉTAT ================= */
let dice = [];       // {value, selected, rolled}
let rollCount = 0;
let threshold = 0;

const $ = id => document.getElementById(id);

function rollDie(d) {
  d.value = 1 + Math.floor(Math.random() * 10);
  d.rolled = true;
  d.selected = false;
}

/* ================= SAUVEGARDE ================= */
function saveState() {
  gameRef.update({ dice, rollCount, threshold, by: myId });
}

/* ================= ACTIONS ================= */
$("rollBtn").onclick = () => {
  // on lit la difficulté avant de lancer
  threshold = parseInt($("threshold").value) || 0;
  const selected = dice.filter(d => d.selected);
  if (selected.length > 0) {
    selected.forEach(rollDie);
  } else {
    dice.forEach(rollDie);
  }
  rollCount++;
  render();
  saveState();
};

$("rerollBtn").onclick = () => {
  const selected = dice.filter(d => d.selected);
  if (selected.length === 0) return;
  threshold = parseInt($("threshold").value) || 0;
  selected.forEach(rollDie);
  rollCount++;
  render();
  saveState();
};

$("addBtn").onclick = () => {
  const d = {value: null, selected: false, rolled: false};
  rollDie(d);
  dice.push(d);
  render();
  saveState();
};

$("resetBtn").onclick = () => {
  dice = [];
  rollCount = 0;
  threshold = 0;
  $("threshold").value = 6;
  render();
  gameRef.remove();
};

// clic sur un dé → sélection/désélection + retrait via ✕
$("diceArea").addEventListener("click", e => {
  const remove = e.target.closest(".remove");
  if (remove) {
    const idx = parseInt(remove.dataset.index);
    dice.splice(idx, 1);
    render();
    saveState();
    return;
  }
  const el = e.target.closest(".die");
  if (el) {
    const idx = parseInt(el.dataset.index);
    dice[idx].selected = !dice[idx].selected;
    render();
    saveState();
  }
});

/* ================= AFFICHAGE ================= */
function render() {
  // 🟣 Règle violette : 2e lancé → les 1, 3e → 1 et 2, 4e et plus → 1, 2 et 3
  let violetMax = 0;
  if (rollCount >= 2) violetMax = 1;
  if (rollCount >= 3) violetMax = 1;
  if (rollCount >= 3) violetMax = 2;
  if (rollCount >= 4) violetMax = 3;

  const area = $("diceArea");
  area.innerHTML = "";
  let total = 0;
  let hasViolet = false;

  dice.forEach((d, i) => {
    const el = document.createElement("div");
    let cls = "die";
    if (d.selected) cls += " selected";
    if (d.rolled && d.value !== null) {
      if (d.value <= violetMax) {
        cls += " violet";
        hasViolet = true;
      } else if (d.value >= threshold) {
        cls += " success";
        total += d.value;
      } else {
        cls += " fail";
        total += d.value;
      }
    }
    el.className = cls;
    el.dataset.index = i;
    el.innerHTML = `<span class="val">${d.rolled && d.value !== null ? d.value : "?"}</span>
      <span class="remove" data-index="${i}" title="Retirer ce dé">✕</span>`;
    area.appendChild(el);
  });

  // total + tête de mort si un dé est violet
  $("totalVal").textContent = total;
  $("skull").className = "skull" + (hasViolet ? " show" : "");

  renderScale();
}

/* ================= ÉCHELLE LANCÉS / ÉCHECS ================= */
function renderScale() {
  const scaleLabels = ["0", "0", "1", "1+2", "1+2+3"];
  const scaleColors = ["", "", "1", "1+2", "1+2+3"];
  const body = $("scaleBody");
  body.innerHTML = "";
  for (let i = 0; i <= 4; i++) {
    const row = document.createElement("tr");
    if (i === rollCount) row.className = "active";
    row.innerHTML = `<td>Lancé ${i}</td><td>${scaleLabels[i]}</td>`;
    body.appendChild(row);
  }
}

/* ================= ÉCOUTE TEMPS RÉEL ================= */
gameRef.on("value", snap => {
  const data = snap.val();
  if (!data) return;
  dice = data.dice || [];
  rollCount = data.rollCount || 0;
  threshold = data.threshold || 0;
  if (data.by !== myId) {
    $("threshold").value = threshold;
  }
  render();
});

render();  // affichage initial
</script>

</body>
</html>
